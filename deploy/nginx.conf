# nginx reverse proxy for LeadBridge (alternative to Caddy).
# /etc/nginx/sites-available/leadbridge  →  symlink into sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: use certbot (`sudo certbot --nginx -d leads.example.com`) and it will add the
# ssl_certificate lines for you.

upstream leadbridge_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Basic abuse protection at the edge; the app also rate-limits per IP.
limit_req_zone $binary_remote_addr zone=leadbridge_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=leadbridge_login:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name leads.example.com;

    # Redirect everything to HTTPS once certificates are installed.
    location / {
        return 301 https://$host$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name leads.example.com;

    ssl_certificate     /etc/letsencrypt/live/leads.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leads.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 15m;          # imports are capped at 12 MB in the app
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Built SPA assets are immutable and content-hashed.
    location /assets/ {
        proxy_pass http://leadbridge_app;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/auth/login {
        limit_req zone=leadbridge_login burst=5 nodelay;
        proxy_pass http://leadbridge_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=leadbridge_api burst=40 nodelay;
        proxy_pass http://leadbridge_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream CSV/XLSX downloads instead of buffering them.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://leadbridge_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/leadbridge.access.log;
    error_log  /var/log/nginx/leadbridge.error.log warn;
}
