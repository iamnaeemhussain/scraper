name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Byte-compile the package
        run: python -m compileall -q backend/app backend/cli.py

      - name: Run the test suite
        working-directory: backend
        env:
          ENVIRONMENT: test
        run: python -m pytest -q --maxfail=1

  frontend:
    name: Frontend build & headless render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build the production bundle
        working-directory: frontend
        run: npm run build

      - name: Check no secrets leaked into the bundle
        working-directory: frontend
        run: |
          if grep -rIl --exclude-dir=node_modules -E "lbk_[A-Za-z0-9_-]{8,}|SECRET_KEY=|BEGIN (RSA|OPENSSH) PRIVATE KEY" dist; then
            echo "::error::A credential-looking string was found in the built bundle"
            exit 1
          fi
          echo "No secrets found in dist/"

      - name: Upload the built app
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  smoke:
    name: End-to-end smoke (API + UI)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start the API
        env:
          ENVIRONMENT: development
          SEED_DEMO_DATA: "true"
          SECRET_KEY: ci-only-secret-key-not-used-in-production
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then echo "API up"; exit 0; fi
            sleep 2
          done
          echo "API failed to start"; cat /tmp/api.log; exit 1

      - name: Start the frontend
        run: |
          cd frontend
          npm ci || npm install
          nohup npm run dev > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then echo "Vite up"; exit 0; fi
            sleep 2
          done
          echo "Vite failed to start"; cat /tmp/vite.log; exit 1

      - name: Render every route in jsdom
        working-directory: frontend
        run: npm run smoke

      - name: Exercise the main modals and drawers
        working-directory: frontend
        run: npm run smoke:ui

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== API ==="; tail -100 /tmp/api.log || true
          echo "=== Vite ==="; tail -100 /tmp/vite.log || true

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: leadbridge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
